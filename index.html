<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f59e0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MealPlanner">
  <title>MealPlanner</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="toast" class="toast"></div>

<!-- ── Menu overlay (mobile) ───────────────────────── -->
<div id="menu-overlay">
  <div class="menu-sheet">
    <div class="menu-sheet-title">More</div>
    <div class="menu-grid">
      <div class="menu-item" data-tab="pantry">
        <div class="menu-item-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v9l9 5 9-5V8"/><path d="M12 13v9"/></svg></div>
        <div class="menu-item-label">Pantry</div>
      </div>
      <div class="menu-item" data-tab="shopping">
        <div class="menu-item-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6H18a2 2 0 0 0 2-1.6L21.5 7H5.5"/></svg></div>
        <div class="menu-item-label">Shopping</div>
      </div>
      <div class="menu-item" data-tab="settings">
        <div class="menu-item-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9aa0c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></div>
        <div class="menu-item-label">Settings</div>
      </div>
    </div>
    <button class="btn btn-ghost" style="width:100%" onclick="document.getElementById('menu-overlay').classList.remove('open')">Close</button>
  </div>
</div>

<div id="app">

  <!-- ── Sidebar (desktop) ─────────────────────────── -->
  <nav id="sidebar">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13Z"/><path d="M4 19.5V6.5"/></svg> MealPlanner</div>

    <a class="nav-item active" data-tab="plan">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Plan
    </a>
    <a class="nav-item" data-tab="recipes">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13Z"/><path d="M4 19.5V6.5"/></svg>
      Recipes
    </a>
    <a class="nav-item" data-tab="pantry">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v9l9 5 9-5V8"/><path d="M12 13v9"/></svg>
      Pantry
    </a>
    <a class="nav-item" data-tab="shopping">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6H18a2 2 0 0 0 2-1.6L21.5 7H5.5"/></svg>
      Shopping
    </a>
    <a class="nav-item" data-tab="settings">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      Settings
    </a>

    <div class="spacer"></div>

    <button id="install-btn" class="btn btn-ghost btn-sm" style="display:none;margin-bottom:8px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Install
    </button>
    <button id="sidebar-theme-btn" class="theme-toggle">☀️ Light</button>
  </nav>

  <!-- ── Main ──────────────────────────────────────── -->
  <main id="main">

    <!-- Plan (weekly calendar) -->
    <div id="tab-plan" class="tab-content active">
      <div class="top-bar"><h1 style="margin:0">Weekly Plan</h1></div>
      <div id="plan-content"></div>
    </div>

    <!-- Recipes (list / detail / form / import all rendered here by JS) -->
    <div id="tab-recipes" class="tab-content"></div>

    <!-- Pantry -->
    <div id="tab-pantry" class="tab-content">
      <div class="top-bar">
        <h1 style="margin:0">Pantry</h1>
        <button class="btn btn-outline btn-sm" id="restock-btn">Restock All</button>
      </div>
      <div id="pantry-content"></div>
    </div>

    <!-- Shopping -->
    <div id="tab-shopping" class="tab-content">
      <div class="top-bar"><h1 style="margin:0">Shopping List</h1></div>
      <div id="shopping-content"></div>
    </div>

    <!-- Settings -->
    <div id="tab-settings" class="tab-content">
      <div class="top-bar"><h1 style="margin:0">Settings</h1></div>
      <div id="settings-content"></div>
    </div>

  </main>
</div>

<!-- ── Bottom nav (mobile only) ────────────────────── -->
<nav id="bottom-nav">
  <div class="nav-item active" data-tab="plan">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Plan
  </div>
  <div class="nav-item" data-tab="pantry">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v9l9 5 9-5V8"/><path d="M12 13v9"/></svg>
    Pantry
  </div>
  <div class="nav-item recipes-btn" data-tab="recipes">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13Z"/><path d="M4 19.5V6.5"/></svg>
    Recipes
  </div>
  <div class="nav-item" data-tab="shopping">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6H18a2 2 0 0 0 2-1.6L21.5 7H5.5"/></svg>
    Shop
  </div>
  <div class="nav-item" id="menu-btn">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    Menu
  </div>
</nav>

<script src="/app.js"></script>
</body>
</html>
